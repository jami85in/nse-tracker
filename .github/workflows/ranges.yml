name: Price Ranges (daily and weekly trading ranges)

# Rebuilds data/ranges/ behind the dashboard's Portfolio → 📏 Ranges tab:
# how far each holding typically moves in a day and a week, and the tested
# 1-3 day and weekly "trade around your holding" plans with the next orders'
# prices. Runs right after every "NSE Daily OHLC Refresh" (so the short-term
# levels refresh each evening on that day's close), plus a manual run.
# Uses the OHLC files already in the repo, plus Kite (read-only market data,
# with that day's login) for SME holdings the NSE archive doesn't cover.

on:
  workflow_run:
    # Also after the morning Kite login, so SME holdings (from Kite) are
    # filled in the same day; without a fresh token that run changes nothing.
    workflows: ["NSE Daily OHLC Refresh", "Kite Daily Token Refresh"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nse-ranges
  cancel-in-progress: false

jobs:
  ranges:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # workflow_run can start a few seconds before main shows the OHLC
      # refresh's commit — pull so today's bar is always included.
      - name: Get the latest OHLC
        run: git pull -q --rebase origin main || true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Holdings the NSE archive doesn't cover (SME "-SM" stocks like FLYSBS):
      # fetch their daily history, lot size and volume from Kite. Needs that
      # day's Kite login; without it this step changes nothing and the ranges
      # are built from what's already saved.
      - name: Price history from Kite for SME holdings
        continue-on-error: true
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          SECRETS_REPO_PAT: ${{ secrets.SECRETS_REPO_PAT }}
          SECRETS_REPO: ${{ secrets.SECRETS_REPO }}
        run: |
          pip install -q kiteconnect
          python scripts/kite_history.py

      - name: Compute ranges
        run: python scripts/ranges.py

      - name: Commit results
        run: |
          git config user.name "nse-tracker-bot"
          git config user.email "actions@github.com"
          git add -A data/ranges
          git diff --staged --quiet && { echo "No changes."; exit 0; }
          git commit -q -m "ranges: $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')"
          for try in 1 2 3; do
            git pull -q --rebase --autostash origin main && git push -q && { echo "Saved."; exit 0; }
            sleep 10
          done
          echo "::error::Could not save the ranges after 3 attempts."
          exit 1
