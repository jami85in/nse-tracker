name: NSE Live Price Update (Kite Connect)

# Uses Zerodha Kite Connect — official, licensed, reliable NSE data.
#
# WHY ONE LONG RUN INSTEAD OF A 15-MINUTE CRON
# The old design scheduled 33 separate runs a day (*/15). GitHub delays and
# DROPS scheduled runs under load, frequent ones first — the commit history
# showed only 1-2 price updates landing per day (e.g. 23 Oct: one update at
# 13:52 out of 33 slots), which is why prices only moved after a manual run.
#
# Now a single run starts before the open and LOOPS for the whole session:
#   - every INTERVAL_SECONDS (default 10 min) it fetches prices and commits;
#   - if today's Kite token isn't refreshed yet it simply waits and re-checks,
#     so prices start flowing within minutes of your daily login, unattended;
#   - it stops 5 minutes after today's close, or earlier at its own limit:
#     340 min (GitHub's cap is 6 h); a limit falling between 14:40 and 15:40 IST
#     moves to 14:40, so the hand-over to a successor run happens before the
#     15:10-15:30 buy-at-close rounds (review 24 Nov 2026). The close comes from scripts/market_session.py, which also knows
#     special sessions such as Diwali Muhurat trading on a Sunday and weekday
#     holidays — before 9 Nov 2026 the loop assumed 15:35 and prices_kite.py
#     treated every weekend as closed, so the Muhurat session got no prices.
#   - it first syncs your Zerodha holdings, so a login also refreshes which
#     stocks you hold (not only the 19:30 evening sync).
#   - every round it also checks Kite for new trades in each account that has
#     logged in today (HUF, wife, mother) and saves them to the private ledger
#     (scripts/trade_watch.py), so a buy or sell shows on the dashboard within
#     about 15-20 minutes instead of after the evening capture, and sends phone
#     alerts through ntfy (scripts/notify.py): swing target/exit levels, GTT and
#     order updates, login reminders, status notices, and STRONG seasonal-cycle
#     dips (down 3%+ today, or 5-12% over 3 days after a 5%+ slide, with the
#     seasonal target still 12%+ above the price).
#   - after the close it starts the daily archive of 1-minute candles for all
#     NSE stocks (minute_archive.yml -> private repo) for intraday research.
#   - if it stops at that limit while the market is still open, it
#     starts its own successor run (workflow_dispatch, which GitHub doesn't
#     drop). On Fri 6 Nov 2026 the login at 07:38 started the loop early, it
#     hit the cap at ~13:28, and the scheduled backups were delayed until the
#     evening — so prices froze at 13:20 for the rest of the day.
# In practice the kite-login worker starts this run: on the HUF login, and from
# its Cloudflare cron at 09:10 IST (skipped if a loop is running or queued).
# GitHub's schedules below often arrive hours late (Nov 2026: 5-16 h), so they
# are only backups; a start after 15:35 exits at once. The older manual "Kite
# Daily Token Refresh" workflow also starts this run when a token is saved.

on:
  schedule:
    - cron: "38 3 * * 1-5"    # 09:08 IST — backup start (often hours late; the worker normally starts the loop)
    - cron: "13 5 * * 1-5"    # 10:43 IST — backup if the morning start was dropped
    - cron: "47 6 * * 1-5"    # 12:17 IST — backup
    - cron: "7 9 * * 1-5"     # 14:37 IST — backup only: a running loop hands over itself at
                              #   14:40 by starting a successor run
  workflow_dispatch:
    inputs:
      interval_seconds:
        description: "Seconds between price fetches (default 600 = 10 min)"
        required: false
        default: "600"
        type: choice                      # a fixed list: free text reached bash arithmetic (review 24 Nov 2026)
        options: ["600", "300", "900", "120"]
      force:
        description: "Fetch even if the calendar says NSE is closed (an unlisted special session)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write
  actions: write     # to hand over to a fresh run when this one reaches GitHub's 6-hour cap

concurrency:
  group: nse-prices-kite
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install kiteconnect

      - name: Sync Zerodha holdings first
        continue-on-error: true
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          SECRETS_REPO_PAT: ${{ secrets.SECRETS_REPO_PAT }}
          SECRETS_REPO: ${{ secrets.SECRETS_REPO }}
        run: |
          python scripts/market_session.py info
          python scripts/fetch_zerodha_holdings.py
          python scripts/fetch_family_holdings.py || echo "::warning::family holdings sync failed — keeping the last list"
          git config user.name "nse-tracker-bot"
          git config user.email "actions@github.com"
          git add data/zerodha_holdings.json
          [ -f data/family_holdings.json ] && git add data/family_holdings.json
          if ! git diff --staged --quiet; then
            git commit -q -m "holdings: sync at $(TZ=Asia/Kolkata date +'%H:%M IST')"
            for try in 1 2 3; do git pull -q --rebase --autostash origin main && git push -q && break; sleep 10; done
          fi

      - name: Price loop (until 5 min after today's close)
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          SECRETS_REPO_PAT: ${{ secrets.SECRETS_REPO_PAT }}
          SECRETS_REPO: ${{ secrets.SECRETS_REPO }}
          KITE_API_KEY_WIFE: ${{ secrets.KITE_API_KEY_WIFE }}
          KITE_API_KEY_MOTHER: ${{ secrets.KITE_API_KEY_MOTHER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          INTERVAL_SECONDS: ${{ github.event.inputs.interval_seconds || '600' }}
          FORCE_SESSION: ${{ github.event.inputs.force || 'false' }}
          GH_TOKEN: ${{ github.token }}
          # abort a git transfer slower than 1 KB/s for 60 s, so a stalled pull/push can't hang
          # the loop until the job is killed (the fallbacks handle the failure - review E3)
          GIT_HTTP_LOW_SPEED_LIMIT: "1000"
          GIT_HTTP_LOW_SPEED_TIME: "60"
        run: |
          git config user.name "nse-tracker-bot"
          git config user.email "actions@github.com"

          case "$INTERVAL_SECONDS" in ''|*[!0-9]*) INTERVAL_SECONDS=600 ;; esac   # digits only
          now()   { date +%s; }
          ist()   { TZ=Asia/Kolkata date +'%H:%M IST'; }
          END=$(python scripts/market_session.py end)
          if [ "$END" = "0" ]; then
            if [ "$FORCE_SESSION" = "true" ]; then
              END=$(TZ=Asia/Kolkata date -d "today 23:30" +%s)
              echo "::notice::No session in the calendar today — forced run until 23:30 IST or the 6-hour cap."
            else
              echo "No NSE session today ($(ist)) — nothing to do. Add it to scripts/market_session.py or run with force=true."
              exit 0
            fi
          fi
          LIMIT=$(( $(now) + 340*60 ))          # stay inside GitHub's 6-hour cap (job timeout 360 min)
          # Hand over BEFORE the 15:10-15:30 buy-at-close rounds, not during them: a limit landing
          # between 14:40 and 15:40 IST moves to 14:40, and the successor run covers the close.
          Q1=$(TZ=Asia/Kolkata date -d "today 14:40" +%s); Q2=$(TZ=Asia/Kolkata date -d "today 15:40" +%s)
          if [ "$LIMIT" -gt "$Q1" ] && [ "$LIMIT" -lt "$Q2" ] && [ "$(now)" -lt "$Q1" ]; then LIMIT=$Q1; fi
          [ "$LIMIT" -lt "$END" ] && END=$LIMIT

          if [ "$(now)" -ge "$END" ]; then
            echo "Started after today's close ($(ist)) — nothing to do."
            exit 0
          fi

          token_fresh() {
            python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from kite_token_reader import get_kite_token
          token, stale = get_kite_token()
          if token is None:
              print("::warning::No Kite token found - check SECRETS_REPO / SECRETS_REPO_PAT secrets.")
              sys.exit(2)
          sys.exit(1 if stale else 0)
          PY
          }

          waited=0; fetched=0
          while [ "$(now)" -lt "$END" ]; do
            # pick up script fixes pushed during the session (notify.py, trade_watch.py)
            # (bash -e: every fallback must succeed, or one network blip would end the loop for the day)
            git pull -q --rebase --autostash origin main || { git rebase --abort 2>/dev/null || true; git reset -q --hard origin/main || true; }
            if token_fresh; then
              python scripts/prices_kite.py || echo "::warning::price fetch failed at $(ist) — will retry"
              git add data/prices_live.json
              if ! git diff --staged --quiet; then
                git commit -q -m "prices(kite): $(date -u +'%H:%M UTC')"
                for try in 1 2 3; do
                  git pull -q --rebase --autostash origin main && git push -q && break
                  echo "push attempt $try failed — retrying"; sleep 10
                done
                fetched=$((fetched+1))
                echo "[$(ist)] prices committed (#$fetched)"
              else
                echo "[$(ist)] no price change (market closed or unchanged)"
              fi
            else
              rc=$?
              # rc 2 = the token file couldn't be read (GitHub API hiccup, or no file yet):
              # keep waiting like a missing login, so family trade sync and alerts carry on.
              if [ "$rc" = "2" ]; then fails=$(( ${fails:-0} + 1 )); else fails=0; fi
              [ "$rc" = "2" ] && [ "$waited" = "0" ] && echo "::warning::Couldn't read the Kite token file — will keep re-checking."
              [ "${fails:-0}" = "3" ] && echo "::error::The Kite token file has been unreadable 3 rounds in a row — check SECRETS_REPO_PAT."
              waited=$((waited+1))
              [ "$waited" = "1" ] && echo "::notice::Today's Kite token isn't refreshed yet — waiting for the daily login, re-checking every ${INTERVAL_SECONDS}s."
              echo "[$(ist)] waiting for today's token..."
            fi
            # New trades in any Kite-connected account that logged in today go to
            # the private ledger now, not only in the evening. Runs even before the
            # HUF login, for wife/mother. Prints nothing about trades.
            python scripts/trade_watch.py || true
            # Phone alerts (ntfy): swing levels, GTT triggers, STRONG cycle dips.
            python scripts/notify.py || true
            # never sleep past the end: an overrunning last sleep let GitHub's 6-hour kill land
            # before the successor run was started (review 24 Nov 2026)
            left=$(( END - $(now) ))
            [ "$left" -le 0 ] && break
            sleep $(( left < INTERVAL_SECONDS ? left : INTERVAL_SECONDS ))
          done
          echo "Loop done at $(ist): $fetched price updates committed."
          SESSION_END=$(python scripts/market_session.py end)
          if [ "$SESSION_END" != "0" ] && [ "$(now)" -lt "$((SESSION_END - 300))" ]; then
            echo "Stopped at the run's time limit before the close — starting a successor run."
            started=""   # four tries: one Actions API hiccup must not end the day's prices (review E8)
            for try in 1 2 3 4; do
              gh workflow run prices_kite.yml --ref "${GITHUB_REF_NAME:-main}" -f interval_seconds="$INTERVAL_SECONDS" && { started=1; break; }
              echo "successor dispatch attempt $try failed"; [ "$try" -lt 4 ] && sleep 30
            done
            [ -n "$started" ] || { echo "::warning::Could not start the successor run — no prices or buy-at-close alerts for the rest of today unless it is started by hand."
                   [ -n "$NTFY_TOPIC" ] && curl -s -m 20 -H "Title: Price loop stopped early" -H "Priority: 4" \
                     -d "The price loop couldn't start its successor run at $(ist): no prices or buy-at-close alerts for the rest of today. Start 'NSE Live Price Update (Kite Connect)' in GitHub Actions." \
                     "https://ntfy.sh/$NTFY_TOPIC" > /dev/null || true; }
          fi

      # After the close: start the daily archive of 1-minute candles for all
      # NSE stocks (minute_archive.yml; its schedules are backups).
      - name: Start today's minute-candle archive
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python - <<'PY'
          import datetime, sys
          sys.path.insert(0, "scripts")
          import market_session
          now = datetime.datetime.now(market_session.IST)
          s = market_session.session(now.date())
          sys.exit(0 if s and now >= s[1] else 1)
          PY
          then gh workflow run minute_archive.yml --ref "${GITHUB_REF_NAME:-main}" && echo "Minute archive started."; else echo "Session not over yet — not starting the archive."; fi

      # Right after the close, ask the private repo's Trade Ledger to capture
      # today's trades and holdings now, instead of waiting for GitHub's evening
      # schedule (on Mon 9 Nov 2026 every scheduled ledger run started after
      # midnight). Writing ledger/capture_request.json there starts it.
      - name: Ask the ledger to capture today's trades
        if: always()
        continue-on-error: true
        env:
          SECRETS_REPO_PAT: ${{ secrets.SECRETS_REPO_PAT }}
          SECRETS_REPO: ${{ secrets.SECRETS_REPO }}
        run: |
          python - <<'PY'
          import base64, datetime, json, os, sys, urllib.request
          sys.path.insert(0, "scripts")
          import market_session
          now = datetime.datetime.now(market_session.IST)
          s = market_session.session(now.date())
          if not s or now < s[1]:
              print("Market not closed yet (or no session today) — not requesting a capture."); sys.exit(0)
          repo, pat = os.environ.get("SECRETS_REPO", ""), os.environ.get("SECRETS_REPO_PAT", "")
          if not repo or not pat:
              print("::warning::SECRETS_REPO / SECRETS_REPO_PAT not set."); sys.exit(0)
          url = f"https://api.github.com/repos/{repo}/contents/ledger/capture_request.json"
          hdr = {"Authorization": f"Bearer {pat}", "Accept": "application/vnd.github+json", "User-Agent": "nse-tracker"}
          sha = None
          try:
              with urllib.request.urlopen(urllib.request.Request(url, headers=hdr), timeout=30) as r:
                  cur = json.load(r)
              sha = cur.get("sha")
              # GitHub starts late scheduled runs hours after the close (11 Nov 2026: four
              # backups at 16:54-22:33 IST), and each one asked for another capture.
              # Skip if today's capture was requested in the last 12 hours (the private repo's
              # scheduled ledger runs cover a failed capture; each extra run costs ~7 private
              # Actions minutes - review E3).
              prev = json.loads(base64.b64decode(cur.get("content", "") or b"e30="))
              if prev.get("session") == now.date().isoformat():
                  try:
                      at = datetime.datetime.strptime(prev.get("requested_at", "")[:16], "%Y-%m-%d %H:%M").replace(tzinfo=market_session.IST)
                  except ValueError:
                      at = None
                  if at and now - at < datetime.timedelta(hours=12):
                      print(f"Today's capture was requested at {at:%H:%M} IST — not asking again yet."); sys.exit(0)
          except SystemExit:
              raise
          except Exception:
              pass
          body = {"message": f"capture request {now:%Y-%m-%d %H:%M} IST (after the close)",
                  "content": base64.b64encode(json.dumps({"session": now.date().isoformat(), "requested_at": f"{now:%Y-%m-%d %H:%M} IST"}).encode()).decode()}
          if sha:
              body["sha"] = sha
          req = urllib.request.Request(url, data=json.dumps(body).encode(), headers=hdr, method="PUT")
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print(f"Capture requested ({r.status}) — the Trade Ledger starts now.")
          except Exception as e:
              print(f"::warning::Could not request the capture ({type(e).__name__}); the evening schedule will still run it.")
          PY

      # A run that fails during market hours (e.g. a successor whose setup step fails) would
      # otherwise stop prices and alerts silently (review E8). A lost runner runs no step at all.
      - name: Tell the phone if this run failed during market hours
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          h=$(TZ=Asia/Kolkata date +%H%M); d=$(TZ=Asia/Kolkata date +%u)
          if [ "$d" -le 5 ] && [ "$h" -ge 0900 ] && [ "$h" -le 1530 ] && [ -n "$NTFY_TOPIC" ]; then
            curl -s -m 20 -H "Title: Price loop run failed" -H "Priority: 4" \
              -d "The price-loop run failed at $(TZ=Asia/Kolkata date +'%H:%M IST'): no prices or alerts until it is started again ('NSE Live Price Update (Kite Connect)' in GitHub Actions)." \
              "https://ntfy.sh/$NTFY_TOPIC" > /dev/null || true
          fi
