name: NSE Live Price Update (Kite Connect)

# Uses Zerodha Kite Connect — official, licensed, reliable NSE data.
#
# WHY ONE LONG RUN INSTEAD OF A 15-MINUTE CRON
# The old design scheduled 33 separate runs a day (*/15). GitHub delays and
# DROPS scheduled runs under load, frequent ones first — the commit history
# showed only 1-2 price updates landing per day (e.g. 23 Oct: one update at
# 13:52 out of 33 slots), which is why prices only moved after a manual run.
#
# Now a single run starts before the open and LOOPS for the whole session:
#   - every INTERVAL_SECONDS (default 10 min) it fetches prices and commits;
#   - if today's Kite token isn't refreshed yet it simply waits and re-checks,
#     so prices start flowing within minutes of your daily login, unattended;
#   - it stops 5 minutes after today's close (or before GitHub's 6-hour job
#     limit). The close comes from scripts/market_session.py, which also knows
#     special sessions such as Diwali Muhurat trading on a Sunday and weekday
#     holidays — before 9 Nov 2026 the loop assumed 15:35 and prices_kite.py
#     treated every weekend as closed, so the Muhurat session got no prices.
#   - it first syncs your Zerodha holdings, so a login also refreshes which
#     stocks you hold (not only the 19:30 evening sync).
#   - if it reaches GitHub's 6-hour cap while the market is still open, it
#     starts its own successor run (workflow_dispatch, which GitHub doesn't
#     drop). On Fri 6 Nov 2026 the login at 07:38 started the loop early, it
#     hit the cap at ~13:28, and the scheduled backups were delayed until the
#     evening — so prices froze at 13:20 for the rest of the day.
# Only one scheduled start has to fire per day; the later cron times are
# backups in case the morning one is dropped. If a loop is already running, a
# later start queues behind it and simply continues the session when the first
# loop hits GitHub's 6-hour job cap (~14:58), or exits at once after 15:35.
#
# The "Kite Daily Token Refresh" workflow also starts this run the moment a
# new token is saved (workflow_dispatch, which GitHub does not drop).

on:
  schedule:
    - cron: "38 3 * * 1-5"    # 09:08 IST — primary start, before the 09:15 open
    - cron: "13 5 * * 1-5"    # 10:43 IST — backup if the morning start was dropped
    - cron: "47 6 * * 1-5"    # 12:17 IST — backup
    - cron: "7 9 * * 1-5"     # 14:37 IST — relay: a GitHub job can run at most 6 h, so the
                              #   09:08 loop stops ~14:58; this start queues behind it and
                              #   covers the last half hour to 15:35
  workflow_dispatch:
    inputs:
      interval_seconds:
        description: "Seconds between price fetches (default 600 = 10 min)"
        required: false
        default: "600"
      force:
        description: "Fetch even if the calendar says NSE is closed (an unlisted special session)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write
  actions: write     # to hand over to a fresh run when this one reaches GitHub's 6-hour cap

concurrency:
  group: nse-prices-kite
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install kiteconnect

      - name: Sync Zerodha holdings first
        continue-on-error: true
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          SECRETS_REPO_PAT: ${{ secrets.SECRETS_REPO_PAT }}
          SECRETS_REPO: ${{ secrets.SECRETS_REPO }}
        run: |
          python scripts/market_session.py info
          python scripts/fetch_zerodha_holdings.py
          git config user.name "nse-tracker-bot"
          git config user.email "actions@github.com"
          git add data/zerodha_holdings.json
          if ! git diff --staged --quiet; then
            git commit -q -m "holdings: sync at $(TZ=Asia/Kolkata date +'%H:%M IST')"
            for try in 1 2 3; do git pull -q --rebase --autostash origin main && git push -q && break; sleep 10; done
          fi

      - name: Price loop (until 5 min after today's close)
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          SECRETS_REPO_PAT: ${{ secrets.SECRETS_REPO_PAT }}
          SECRETS_REPO: ${{ secrets.SECRETS_REPO }}
          INTERVAL_SECONDS: ${{ github.event.inputs.interval_seconds || '600' }}
          FORCE_SESSION: ${{ github.event.inputs.force || 'false' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "nse-tracker-bot"
          git config user.email "actions@github.com"

          now()   { date +%s; }
          ist()   { TZ=Asia/Kolkata date +'%H:%M IST'; }
          END=$(python scripts/market_session.py end)
          if [ "$END" = "0" ]; then
            if [ "$FORCE_SESSION" = "true" ]; then
              END=$(TZ=Asia/Kolkata date -d "today 23:30" +%s)
              echo "::notice::No session in the calendar today — forced run until 23:30 IST or the 6-hour cap."
            else
              echo "No NSE session today ($(ist)) — nothing to do. Add it to scripts/market_session.py or run with force=true."
              exit 0
            fi
          fi
          LIMIT=$(( $(now) + 350*60 ))          # stay inside GitHub's 6-hour cap
          [ "$LIMIT" -lt "$END" ] && END=$LIMIT

          if [ "$(now)" -ge "$END" ]; then
            echo "Started after today's close ($(ist)) — nothing to do."
            exit 0
          fi

          token_fresh() {
            python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from kite_token_reader import get_kite_token
          token, stale = get_kite_token()
          if token is None:
              print("::warning::No Kite token found - check SECRETS_REPO / SECRETS_REPO_PAT secrets.")
              sys.exit(2)
          sys.exit(1 if stale else 0)
          PY
          }

          waited=0; fetched=0
          while [ "$(now)" -lt "$END" ]; do
            if token_fresh; then
              python scripts/prices_kite.py || echo "::warning::price fetch failed at $(ist) — will retry"
              git add data/prices_live.json
              if ! git diff --staged --quiet; then
                git commit -q -m "prices(kite): $(date -u +'%H:%M UTC')"
                for try in 1 2 3; do
                  git pull -q --rebase --autostash origin main && git push -q && break
                  echo "push attempt $try failed — retrying"; sleep 10
                done
                fetched=$((fetched+1))
                echo "[$(ist)] prices committed (#$fetched)"
              else
                echo "[$(ist)] no price change (market closed or unchanged)"
              fi
            else
              rc=$?
              [ "$rc" = "2" ] && { echo "::error::Token unavailable — stopping."; exit 1; }
              waited=$((waited+1))
              [ "$waited" = "1" ] && echo "::notice::Today's Kite token isn't refreshed yet — waiting for the daily login, re-checking every ${INTERVAL_SECONDS}s."
              echo "[$(ist)] waiting for today's token..."
            fi
            sleep "$INTERVAL_SECONDS"
          done
          echo "Loop done at $(ist): $fetched price updates committed."
          SESSION_END=$(python scripts/market_session.py end)
          if [ "$SESSION_END" != "0" ] && [ "$(now)" -lt "$((SESSION_END - 300))" ]; then
            echo "Hit the 6-hour cap before the close — starting a successor run."
            gh workflow run prices_kite.yml --ref "${GITHUB_REF_NAME:-main}" -f interval_seconds="$INTERVAL_SECONDS" \
              || echo "::warning::Could not start the successor run — prices may stop until the next scheduled start."
          fi

      # Right after the close, ask the private repo's Trade Ledger to capture
      # today's trades and holdings now, instead of waiting for GitHub's evening
      # schedule (on Mon 9 Nov 2026 every scheduled ledger run started after
      # midnight). Writing ledger/capture_request.json there starts it.
      - name: Ask the ledger to capture today's trades
        if: always()
        continue-on-error: true
        env:
          SECRETS_REPO_PAT: ${{ secrets.SECRETS_REPO_PAT }}
          SECRETS_REPO: ${{ secrets.SECRETS_REPO }}
        run: |
          python - <<'PY'
          import base64, datetime, json, os, sys, urllib.request
          sys.path.insert(0, "scripts")
          import market_session
          now = datetime.datetime.now(market_session.IST)
          s = market_session.session(now.date())
          if not s or now < s[1]:
              print("Market not closed yet (or no session today) — not requesting a capture."); sys.exit(0)
          repo, pat = os.environ.get("SECRETS_REPO", ""), os.environ.get("SECRETS_REPO_PAT", "")
          if not repo or not pat:
              print("::warning::SECRETS_REPO / SECRETS_REPO_PAT not set."); sys.exit(0)
          url = f"https://api.github.com/repos/{repo}/contents/ledger/capture_request.json"
          hdr = {"Authorization": f"Bearer {pat}", "Accept": "application/vnd.github+json", "User-Agent": "nse-tracker"}
          sha = None
          try:
              with urllib.request.urlopen(urllib.request.Request(url, headers=hdr), timeout=30) as r:
                  sha = json.load(r).get("sha")
          except Exception:
              pass
          body = {"message": f"capture request {now:%Y-%m-%d %H:%M} IST (after the close)",
                  "content": base64.b64encode(json.dumps({"session": now.date().isoformat(), "requested_at": f"{now:%Y-%m-%d %H:%M} IST"}).encode()).decode()}
          if sha:
              body["sha"] = sha
          req = urllib.request.Request(url, data=json.dumps(body).encode(), headers=hdr, method="PUT")
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print(f"Capture requested ({r.status}) — the Trade Ledger starts now.")
          except Exception as e:
              print(f"::warning::Could not request the capture ({type(e).__name__}); the evening schedule will still run it.")
          PY
