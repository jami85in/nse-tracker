name: One-off - purge old holdings snapshots from git history

# ONE-OFF (23 Nov 2026), run once and then delete this file and the HISTORY_PAT secret.
# Before 9 Nov 2026, data/zerodha_holdings.json carried the HUF holdings' quantities,
# average prices and P&L; the current file lists symbols only. This removes every
# old version of that file from the history of main, keeps today's clean copy, and
# force-pushes main.
#
# Needs repository secret HISTORY_PAT: a fine-grained token for jami85in/nse-tracker
# only, with Contents: Read and write and Workflows: Read and write (the rewritten
# commits include workflow changes, which the built-in token may not push).
# Shares the price loop's concurrency group, so it never runs alongside it.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PURGE to rewrite the history of main"
        required: true

concurrency:
  group: nse-prices-kite
  cancel-in-progress: false

jobs:
  purge:
    if: ${{ github.event.inputs.confirm == 'PURGE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.HISTORY_PAT }}

      - name: Rewrite history without the old holdings snapshots
        env:
          HISTORY_PAT: ${{ secrets.HISTORY_PAT }}
        run: |
          set -euo pipefail
          [ -n "$HISTORY_PAT" ] || { echo "::error::Secret HISTORY_PAT is not set."; exit 1; }
          pip install --quiet git-filter-repo
          F=data/zerodha_holdings.json
          ORIG=$(git rev-parse HEAD)
          cp "$F" /tmp/keep.json
          if grep -q '"avgPrice"\|"pnl"' /tmp/keep.json; then
            echo "::error::Today's $F still has amounts - fix it before purging."; exit 1
          fi
          count_bad() {
            git rev-list --all -- "$F" | while read -r c; do
              git show "$c:$F" 2>/dev/null | grep -q '"avgPrice"\|"pnl"' && echo x || true
            done | wc -l
          }
          echo "commits on main: $(git rev-list --count HEAD); versions with amounts: $(count_bad)"
          git filter-repo --force --path "$F" --invert-paths
          mkdir -p data && cp /tmp/keep.json "$F"
          git config user.name "nse-tracker-bot"
          git config user.email "actions@github.com"
          git add "$F"
          git commit -q -m "Restore data/zerodha_holdings.json (symbols only) after removing old snapshots from history"
          left=$(count_bad)
          echo "versions with amounts after the rewrite: $left"
          [ "$left" = "0" ] || { echo "::error::Old amounts still in history - not pushing."; exit 1; }
          git remote add origin "https://x-access-token:${HISTORY_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          # refuse if anything was pushed to main since this run started
          git push --force-with-lease="main:${ORIG}" origin HEAD:main
          echo "History rewritten: main is now $(git rev-parse --short HEAD) ($(git rev-list --count HEAD) commits)."
