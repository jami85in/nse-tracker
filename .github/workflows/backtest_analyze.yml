name: NSE Historical Backtest Analysis

# Runs the squeeze/blast cycle analysis over whatever historical data has
# been collected so far (data/backtest/raw_closes/). Safe to run on partial
# data — you'll get an early, incomplete-but-informative look while the
# collector workflow is still filling in history. Re-run anytime; it always
# reflects the current state of collected data.

on:
  schedule:
    - cron: "30 18 * * *"   # once daily, 6:30pm UTC (~midnight IST, after collection for the day)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run cycle analysis
        run: python scripts/backtest_analyze.py

      - name: Commit report
        run: |
          git config user.name "nse-tracker-bot"
          git config user.email "actions@github.com"
          git add data/backtest/report.json
          git diff --staged --quiet && { echo "No changes."; exit 0; }
          git commit -m "backtest: analysis report $(date -u +'%Y-%m-%d')"
          # GitHub may start this hours late, inside market hours, where the price loop pushes every
          # 2 minutes: retry instead of failing on one rejected push (review 27 Nov 2026)
          for try in 1 2 3 4; do
            git pull -q --rebase --autostash origin main && git push -q && exit 0
            git rebase --abort 2>/dev/null || true; sleep 15
          done
          echo "::error::Could not push after 4 attempts."; exit 1
