name: NSE Daily OHLC Refresh

# Keeps the committed OHLC current every evening so the scan's reliable price
# floor never lags. The historical backfill collector (backtest_collect_ohlc)
# sets done=True once it reaches the frontier and then stops fetching new days
# entirely — which froze the data at 2026-07-07 and was the root cause of the
# stale on-dashboard prices. This job runs in DAILY mode: it re-fetches a short
# trailing window for all symbols and merges the newest trading day(s) in,
# independent of the backfill's chunk progress.
#
# Schedule: 19:00 IST on weekdays (13:30 UTC), backup 04:45 IST; GitHub often
# starts these hours late (Nov 2026: 02:00-06:40 IST). The 3-day dip alert needs
# the previous session's bar by 15:10 next day: one missed night is filled from
# Kite's previous close; two in a row and the rule skips the day (phone notice).
# Holidays: the worker returns the previous session's file for them, so a
# purge step below removes those copies (see scripts/purge_holiday_bars.py).

on:
  schedule:
    - cron: "30 13 * * 1-5"   # 19:00 IST, Mon-Fri
    - cron: "15 23 * * 1-5"   # 04:45 IST next morning — backup (GitHub often runs schedules hours late;
                              #   a run that finds nothing new commits nothing)
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Trailing days to re-fetch and merge"
        required: false
        default: "12"

permissions:
  contents: write

concurrency:
  group: nse-ohlc-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Daily OHLC refresh (frontier)
        env:
          BACKTEST_WORKER_URL: ${{ secrets.BACKTEST_WORKER_URL }}
          BACKTEST_MODE: "daily"
          BACKTEST_UNIVERSE: "all"
          # EQ plus trade-to-trade (BE/BZ), so a stock NSE moves to T2T under
          # surveillance keeps getting daily bars instead of going stale.
          BACKTEST_SERIES: "EQ,BE,BZ"
          BACKTEST_DAILY_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '12' }}
        # The 3-day dip rule needs the latest session's bar: retry (3 min apart) until reference
        # stocks have it, and fail the run (red) if they still don't, instead of passing silently.
        run: |
          for try in 1 2 3; do
            python scripts/backtest_fetch_ohlc.py || echo "::warning::fetch attempt $try failed"
            if python - <<'PY'
          import datetime, json, sys
          sys.path.insert(0, "scripts")
          import market_session as M
          now = datetime.datetime.now(M.IST)
          s = M.session(now.date())
          d = now.date() if (s and now.date().weekday() < 5 and now >= s[1] + datetime.timedelta(hours=2)) else now.date() - datetime.timedelta(days=1)
          while d.weekday() >= 5 or d.isoformat() in M.HOLIDAYS:
              d -= datetime.timedelta(days=1)
          ok = 0
          for sym in ("RELIANCE", "TCS", "HDFCBANK", "INFY", "ITC"):
              try:
                  ok += max(b.get("date", "") for b in json.load(open(f"data/backtest/raw_ohlc/{sym}.json"))) >= d.isoformat()
              except Exception:
                  pass
          print(f"Latest session {d}: {ok}/5 reference stocks have its bar")
          sys.exit(0 if ok >= 4 else 1)
          PY
            then exit 0; fi
            [ "$try" -lt 3 ] && sleep 180
          done
          echo "::error::The latest session's bars are still missing after 3 tries"; exit 1

      # NSE hands back the previous session's file for a holiday, so each
      # holiday turned into a fake copy of the day before. Drop those.
      - name: Remove holiday copies
        if: always()
        run: python scripts/purge_holiday_bars.py

      - name: Commit refreshed data
        if: always()
        run: |
          git config user.name "nse-tracker-bot"
          git config user.email "actions@github.com"
          git add data/backtest/raw_ohlc/ data/backtest/progress_ohlc.json
          if [ -d data/backtest/raw_ohlc_hist ]; then git add data/backtest/raw_ohlc_hist/; fi
          git diff --staged --quiet || git commit -m "ohlc-daily: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          for try in 1 2 3; do git pull -q --rebase --autostash origin main && git push -q && break; sleep 15; done
