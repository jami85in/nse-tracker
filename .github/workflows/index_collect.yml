name: NSE Index & Sectoral Data Collector

# Collects daily NIFTY 50 + sectoral index data for relative-strength
# analysis (is a stock moving with or against its sector/the broader market).

on:
  schedule:
    - cron: "41 13 * * 1-5"    # 19:11 IST weekdays, after the 19:00 OHLC refresh. The backfill
                               # finished long ago; each run now tops up the last few weeks.
                               # (Was every 5 minutes — 288 no-op runs a day since July.)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nse-index-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Fetch index chunks
        env:
          BACKTEST_WORKER_URL: ${{ secrets.BACKTEST_WORKER_URL }}
          INDEX_CHUNK_DAYS: "28"
          INDEX_START_DATE: "2020-09-01"
          INDEX_TIME_BUDGET_SECONDS: "300"
          INDEX_PAUSE_SECONDS: "5"
        run: python scripts/index_fetch.py

      - name: Commit accumulated data
        if: always()
        run: |
          git config user.name "nse-tracker-bot"
          git config user.email "actions@github.com"
          git add data/backtest/raw_indices/ data/backtest/progress_indices.json
          git diff --staged --quiet && { echo "No changes."; exit 0; }
          git commit -q -m "index-data: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          # 19:11 IST overlaps the OHLC refresh and the scan/ranges commits it sets off
          for try in 1 2 3; do
            git pull -q --rebase --autostash origin main && git push -q && { echo "Saved."; exit 0; }
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "::error::Could not save the index data after 3 attempts."
          exit 1
