name: NSE Live Price Update (LEGACY — manual fallback only)

# ⚠ SCHEDULE DISABLED. Superseded by "NSE Live Price Update (Kite Connect)".
#
# Why: this workflow and prices_kite.yml BOTH write data/prices_live.json,
# but sat in DIFFERENT concurrency groups (nse-prices vs nse-prices-kite),
# so they never blocked each other. This one ran 9x/hour against Kite's
# 4x/hour, so it overwrote the licensed Kite data roughly two writes out of
# every three.
#
# That silently broke two things downstream:
#   1. scripts/prices.py emitted no "source" field, so the frontend's
#      isKite() check failed -> the live badge never showed and liveFeed
#      stayed false even during market hours.
#   2. It emitted no "data_date" field, so the frontend's data-recency
#      comparison fell back to file write times — reintroducing exactly the
#      stale-price bug that field was added to fix.
#
# It also scrapes NSE directly, which is the unreliable source Kite Connect
# was adopted to replace.
#
# Kept as a manual fallback (workflow_dispatch) in case Kite is ever
# unavailable for an extended period. scripts/prices.py now also emits
# source/data_date, so a manual run degrades gracefully instead of
# corrupting the data contract.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Same group as the Kite workflow, so if this is ever run manually it
  # queues behind the scheduled job instead of racing it on the git push.
  group: nse-prices-kite
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch live prices from NSE (fallback source)
        run: python scripts/prices.py

      - name: Commit price data
        run: |
          git config user.name "nse-tracker-bot"
          git config user.email "actions@github.com"
          git pull --rebase --autostash origin main || true
          git add data/prices_live.json
          git diff --staged --quiet || git commit -m "prices(legacy fallback): $(TZ='Asia/Kolkata' date +'%H:%M IST')"
          git push
