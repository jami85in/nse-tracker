<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agents · NSE Tracker</title>
<meta name="theme-color" content="#0A0E1A" />
<!-- Agents page: live status of every scheduled job of the NSE tracker.
     Public file: holds no trade data and no keys. Private status (ledger, logins,
     check-in) is read in the browser with the read-only key saved by the
     dashboard's Ledger tab (localStorage "ledger_pat"), the same as the dashboard. -->
<style>
/* VOICE: calm control room; IDEA: a station departures board for the jobs;
   PICTURE: today's run line with one lamp per stage; COLOUR/TYPE: the dashboard's navy,
   teal accent, system sans; LAYOUT: finding first, line, then grouped boards. */
:root{--bg:#0A0E1A;--surface:#111827;--card:#161D2E;--border:#1E2D45;--ink:#E8EDF5;--muted:#8A97B3;
 --accent:#00D4AA;--ok:#22C55E;--run:#4FA3FF;--warn:#FFB800;--fail:#EF4444;--act:#FF6B35;--idle:#8C99B5}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
.wrap{max-width:1100px;margin:0 auto;padding:16px max(4vw,14px) 40px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.back{color:var(--muted);text-decoration:none;font-size:14px;padding:10px 0}
.top .sp{flex:1}
.btn{background:var(--card);color:var(--ink);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font:inherit;font-size:14px;cursor:pointer;min-height:44px}
.btn:focus-visible,.row:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:#04110E;border-color:var(--accent);font-weight:600}
h1{font-size:clamp(28px,6vw,40px);line-height:1.05;margin:6px 0 4px;text-wrap:balance}
.finding{font-size:17px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0}
.banner{background:#1d1606;border:1px solid #5a4510;color:#ffd77a;border-radius:12px;padding:10px 14px;margin:14px 0 0;font-size:14px}
.banner[hidden]{display:none}
/* the run line */
.line{margin:20px 0 6px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 14px 12px}
.line h2{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 12px}
.track{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));position:relative}
.track::before{content:"";position:absolute;left:8%;right:8%;top:15px;height:3px;background:var(--border);border-radius:2px}
.stop{position:relative;text-align:center;padding:0 2px;cursor:pointer;background:none;border:0;color:inherit;font:inherit}
.lamp{width:32px;height:32px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-weight:700;font-size:15px;border:3px solid var(--bg);position:relative}
.stop b{display:block;font-size:12.5px;font-weight:600;line-height:1.2}
.stop span{display:block;font-size:11.5px;color:var(--muted);line-height:1.25;margin-top:2px}
/* boards */
.group{margin-top:22px}
.group h2{font-size:15px;margin:0 0 8px;display:flex;gap:8px;align-items:baseline}
.group h2 small{color:var(--muted);font-weight:400;font-size:13px}
.board{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 14px;border-top:1px solid var(--border);cursor:pointer;width:100%;text-align:left;background:none;color:inherit;font:inherit;border-left:0;border-right:0;border-bottom:0}
.row:first-child{border-top:0}
.row:hover{background:#141c2c}
.dot{width:12px;height:12px;border-radius:50%;grid-row:span 2}
.name{font-weight:600;font-size:15px}
.what{color:var(--muted);font-size:13px;grid-column:2}
.chip{justify-self:end;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.when{grid-column:3;justify-self:end;color:var(--muted);font-size:12px;white-space:nowrap;text-align:right}
.s-ok{--c:var(--ok)}.s-run{--c:var(--run)}.s-warn{--c:var(--warn)}.s-fail{--c:var(--fail)}.s-act{--c:var(--act)}.s-wait{--c:var(--run)}.s-idle{--c:var(--idle)}.s-unk{--c:var(--idle)}
.dot,.lamp{background:var(--c)}
.lamp{color:#07101c}
.chip{color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.s-run .dot,.s-run .lamp{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.s-run .dot,.s-run .lamp{animation:none}}
/* ask */
.ask{margin-top:26px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px}
.ask h2{font-size:15px;margin:0 0 4px}
textarea{width:100%;min-height:76px;background:var(--bg);color:var(--ink);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;resize:vertical}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.note{color:var(--muted);font-size:12.5px;margin:8px 0 0}
/* detail sheet */
.shade{position:fixed;inset:0;background:#0009;z-index:10}
.sheet{position:fixed;z-index:11;background:var(--card);border:1px solid var(--border);overflow:auto;
 left:0;right:0;bottom:0;max-height:88vh;max-height:88dvh;border-radius:18px 18px 0 0;padding:16px max(4vw,14px) 24px}
@media (min-width:860px){.sheet{left:auto;top:0;bottom:0;width:470px;max-height:none;border-radius:0;padding:20px 22px}}
.sheet[hidden],.shade[hidden]{display:none}
.sheet h3{font-size:22px;margin:4px 0 6px;line-height:1.15}
.sheet .why{font-size:15px;margin:8px 0 12px}
.sheet h4{font-size:13px;color:var(--muted);margin:16px 0 6px;font-weight:600}
.sheet p{margin:0 0 8px}
.facts{margin:0;padding:0;list-style:none}
.facts li{padding:6px 0;border-top:1px solid var(--border);font-size:14px}
.facts li:first-child{border-top:0}
.runs{width:100%;border-collapse:collapse;font-size:13.5px}
.runs td{padding:6px 4px;border-top:1px solid var(--border);vertical-align:top}
.runs td:last-child{text-align:right;white-space:nowrap}
.close{position:sticky;top:0;float:right;background:var(--surface)}
@media (max-width:600px){.track .stop span{font-size:11px}.stop b{font-size:11.5px}.lamp{width:28px;height:28px;font-size:13px}.track::before{top:13px}.when{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="./">← Dashboard</a>
    <span class="sp"></span>
    <button class="btn" id="refresh" type="button">Refresh</button>
  </div>
  <h1 id="title">Agents</h1>
  <p class="finding" id="finding">Loading status…</p>
  <p class="sub" id="updated"></p>
  <div class="banner" id="banner" hidden></div>
  <section class="group" id="attn" hidden aria-labelledby="attnh"><h2 id="attnh">Needs attention</h2><div class="board" id="attn-board"></div></section>

  <section class="line" aria-labelledby="lineh">
    <h2 id="lineh">Today's run line</h2>
    <div class="track" id="track"></div>
  </section>

  <div id="groups"></div>

  <section class="ask" id="askall" aria-labelledby="askh">
    <h2 id="askh">Ask Claude about your agents</h2>
    <p class="sub">Your question goes with the current status of every agent (no amounts, no keys).</p>
    <textarea id="q-all" placeholder="e.g. Why is the ledger late? What runs tonight?"></textarea>
    <div class="acts">
      <button class="btn primary" type="button" data-ask="copy" data-q="q-all">Copy &amp; open my Stock market chat</button>
      <button class="btn" type="button" data-ask="new" data-q="q-all">Ask in a new Claude chat</button>
    </div>
    <p class="note" id="copied-all" aria-live="polite"></p>
  </section>
</div>

<div class="shade" id="shade" hidden></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="d-title" hidden>
  <button class="btn close" type="button" id="d-close">Close</button>
  <div id="d-body"></div>
</aside>

<script>
{
const PUB = "jami85in/nse-tracker";
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } };
const PAT = lsGet("ledger_pat", "");
const PRIV = lsGet("ledger_repo", "jami85in/nse-tracker-secrets");
const PROJECT_URL = "https://claude.ai/project/019e24b8-6ea8-76c1-a35d-0f1aad75cc54";
const IST = 19800000, H = 3600e3, MIN = 60e3;
// NSE calendar: keep in step with scripts/market_session.py
const HOLIDAYS = new Set(["2026-11-10", "2026-11-24", "2026-12-25"]);
const SPECIAL = { "2026-11-08": [14 * 60 + 20, 15 * 60 + 30] };   // date: [open, close] minutes IST

const pad = n => String(n).padStart(2, "0");
const ist = d => { const x = new Date(d.getTime() + IST); return { y: x.getUTCFullYear(), m: x.getUTCMonth() + 1, d: x.getUTCDate(), h: x.getUTCHours(), mi: x.getUTCMinutes(), dow: x.getUTCDay() }; };
const atIST = (y, m, d, h, mi) => new Date(Date.UTC(y, m - 1, d, h, mi) - IST);
const dayKey = p => `${p.y}-${pad(p.m)}-${pad(p.d)}`;
const isTrading = p => !!SPECIAL[dayKey(p)] || (p.dow !== 0 && p.dow !== 6 && !HOLIDAYS.has(dayKey(p)));
const session = p => SPECIAL[dayKey(p)] || [9 * 60 + 15, 15 * 60 + 30];
const dayOf = (date, k) => { const p = ist(date); return ist(atIST(p.y, p.m, p.d + k, 12, 0)); };
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const hhmm = d => { const p = ist(d); return `${pad(p.h)}:${pad(p.mi)}`; };
function when(d, now) {
  if (!d) return "never";
  const a = ist(d), t = ist(now), y = dayOf(now, -1), tm = dayOf(now, 1);
  if (dayKey(a) === dayKey(t)) return `today ${hhmm(d)}`;
  if (dayKey(a) === dayKey(y)) return `yesterday ${hhmm(d)}`;
  if (dayKey(a) === dayKey(tm)) return `tomorrow ${hhmm(d)}`;
  return `${DOW[a.dow]} ${a.d} ${MON[a.m - 1]} ${hhmm(d)}`;
}
function ago(d, now) {
  const m = Math.round((now - d) / MIN);
  if (m < 1) return "just now"; if (m < 60) return `${m} min ago`;
  const h = Math.round(m / 60); if (h < 48) return `${h} h ago`;
  return `${Math.round(h / 24)} days ago`;
}
const parseIstText = s => { const m = /^(\d{4})-(\d\d)-(\d\d)[ T](\d\d):(\d\d)/.exec(s || ""); return m ? atIST(+m[1], +m[2], +m[3], +m[4], +m[5]) : null; };
const parseAny = s => { if (!s) return null; if (/IST$/.test(s)) return parseIstText(s); const d = new Date(s); return isNaN(d) ? null : d; };

// ── cron (UTC, as GitHub reads it) ──
function cronField(f, lo, hi) {
  if (f === "*") return null;
  const s = new Set();
  for (const part of f.split(",")) {
    const [r, st0] = part.split("/"); const st = st0 ? +st0 : 1;
    let a, b;
    if (r === "*") { a = lo; b = hi; } else if (r.includes("-")) { [a, b] = r.split("-").map(Number); } else { a = +r; b = st0 ? hi : a; }
    for (let v = a; v <= b; v += st) s.add(v);
  }
  return s;
}
function nextFire(crons, from) {
  const cs = crons.map(c => { const f = c.trim().split(/\s+/); return { mi: cronField(f[0], 0, 59), h: cronField(f[1], 0, 23), dom: cronField(f[2], 1, 31), mon: cronField(f[3], 1, 12), dow: cronField(f[4], 0, 6) }; });
  const ok = (s, v) => !s || s.has(v);
  let t = new Date(Math.ceil((from.getTime() + 1) / MIN) * MIN);
  for (let i = 0; i < 8 * 1440; i++, t = new Date(t.getTime() + MIN)) {
    for (const c of cs) {
      const dd = c.dom && c.dow ? (ok(c.dom, t.getUTCDate()) || ok(c.dow, t.getUTCDay())) : (ok(c.dom, t.getUTCDate()) && ok(c.dow, t.getUTCDay()));
      if (ok(c.mi, t.getUTCMinutes()) && ok(c.h, t.getUTCHours()) && ok(c.mon, t.getUTCMonth() + 1) && dd) return t;
    }
  }
  return null;
}

// ── the agents ──
// due: {days: trading|daily|sat|sun, at:[h,m] IST, allow: hours after "at" by which a run should have finished}
const AGENTS = [
  { id: "login", g: "day", name: "Kite login (HUF)", short: "Login", repo: "priv", when: "You, each trading morning (one tap)",
    what: "Gives the price loop and the ledger today's access to Kite.",
    how: "You tap the login link; the Cloudflare worker saves today's session in the private repo and starts the price loop. Family accounts log in the same way on the days they trade. The key itself is never shown here: this page only reads when it was last saved." },
  { id: "prices", g: "day", name: "Live prices & alerts", short: "Prices", file: "prices_kite.yml", repo: "pub",
    crons: ["38 3 * * 1-5", "13 5 * * 1-5", "47 6 * * 1-5", "7 9 * * 1-5"],
    when: "09:10–15:35 on trading days, every 5 minutes",
    what: "Fetches Kite prices every 5 minutes and sends dip, swing and GTT alerts to your phone.",
    how: "Started by your login or by the Cloudflare worker at 09:10 (GitHub backups at 09:08, 10:43, 12:17 and 14:37). Each run lasts up to 340 minutes and hands over to a fresh one before the 15:10 buy-at-close rounds. No alert goes out on prices more than 25 minutes old." },
  { id: "morning", g: "day", name: "Morning summary", short: "Morning", repo: "priv", when: "From 08:45 on trading days (inside the price loop)",
    what: "One phone message before the open: “Ready for the open”, or the first thing to do.",
    how: "Each round of the price loop checks the login, the overnight scan, the ledger, the watchdog and the 1-minute backfill, and sends the summary once a day." },
  { id: "ledger", g: "day", name: "Trade capture & ledger", short: "Ledger", file: "ledger.yml", repo: "priv",
    crons: ["47 10 * * 1-5", "52 12 * * 1-5", "22 15 * * 1-5", "37 17 * * 1-5"], due: { days: "trading", at: [15, 30], allow: 10 },
    when: "Right after the close (started by the price loop); backups 16:17, 18:22, 20:52, 23:07",
    what: "Captures the day's trades and holdings from Kite for every account, refreshes dividends and bonuses, and rebuilds every ledger and the family view.",
    how: "Runs in the private repo, so trade data and logs never become public. Also runs when you upload a tradebook or change adjustments. Writes a small digest of open items that the watchdog and the evening check-in read." },
  { id: "checkin", g: "day", name: "Evening check-in (Claude)", short: "Check-in", file: "evening_checkin.yml", repo: "priv",
    crons: ["43 15 * * 1-5", "13 18 * * 1-5"], due: { days: "trading", at: [21, 13], allow: 6 },
    when: "21:13 on trading days (backup 23:43)",
    what: "Claude reads the ledger digest, explains any new issue, proposes a fix, saves a note and sends one line to your phone.",
    how: "Runs Claude inside a private GitHub job with read-only tools; it can only write its own note. A privacy filter checks the phone line, which never carries amounts." },
  { id: "watchdog", g: "day", name: "Watchdog", short: "Watchdog", file: "watchdog.yml", repo: "pub", crons: ["23 */2 * * *"],
    when: "Every 2 hours, all week",
    what: "Checks the ledger, the daily scan and the 1-minute backfill, and alerts once per new problem.",
    how: "Runs in the public repo (free minutes) and reads private status with a key kept as a GitHub secret. It remembers what it has already alerted, so you hear about each problem once." },
  { id: "archive", g: "day", name: "1-minute candles: daily archive", short: "Archive", file: "minute_archive.yml", repo: "pub",
    crons: ["47 10 * * 1-5", "22 13 * * 1-5", "7 16 * * 1-5"], due: { days: "trading", at: [16, 17], allow: 10 },
    when: "16:17 on weekdays (backups 18:52, 21:37)", what: "Saves the day's 1-minute candles for all NSE stocks.",
    how: "Needs that day's Kite login. Stored as a private release in the secrets repo." },
  { id: "backfill", g: "day", name: "1-minute candles: history", short: "Backfill", file: "minute_history.yml", repo: "pub",
    crons: ["1 4 * * *", "17 11 * * *", "7 17 * * *"],
    when: "While the day's login lasts; each run starts the next until 05:40",
    what: "Downloads 1-minute history for all NSE stocks since Feb 2015, a month at a time.",
    how: "Uses the HUF login, so it only moves on days you log in. Progress is kept in the private repo." },

  { id: "ohlc", g: "eve", name: "Daily OHLC refresh", file: "ohlc_daily_refresh.yml", repo: "pub", crons: ["30 13 * * 1-5", "15 23 * * 1-5"],
    due: { days: "trading", at: [19, 0], allow: 12 }, when: "19:00 on weekdays (backup 04:45)", what: "Updates the daily price history of every stock.",
    how: "Feeds the scan, the ranges, the cycles and the 3-day dip rule." },
  { id: "scan", g: "eve", name: "Squeeze & blast scan", short: "Scan", file: "scan.yml", repo: "pub", due: { days: "trading", at: [19, 0], allow: 13 },
    when: "After the OHLC refresh", what: "Finds the squeeze, blast and short setups the dashboard lists.",
    how: "Starts by itself when the OHLC refresh finishes." },
  { id: "ranges", g: "eve", name: "Price ranges", file: "ranges.yml", repo: "pub", due: { days: "trading", at: [19, 0], allow: 13 },
    when: "After the scan", what: "Works out daily and weekly trading ranges.", how: "Starts by itself after the scan." },
  { id: "index", g: "eve", name: "Index & sector data", file: "index_collect.yml", repo: "pub", crons: ["41 13 * * 1-5"],

  { id: "meta", g: "eve", name: "Symbols metadata", file: "symbols_meta.yml", repo: "pub", crons: ["0 14 * * 1-5"],
    due: { days: "trading", at: [19, 30], allow: 11 }, when: "19:30 on weekdays", what: "Rebuilds names, sectors and listing details for every symbol.", how: "Used across the dashboard." },

  { id: "cycles", g: "week", name: "Seasonal cycles", file: "cycles.yml", repo: "pub", crons: ["17 4 * * 6"],
    due: { days: "sat", at: [9, 47], allow: 14 }, when: "Saturday 09:47", what: "Market caps and the seasonal cycle analysis behind the Cycles tab and the dip alerts.", how: "Runs on Saturday when markets are closed." },
  { id: "sqbt", g: "week", name: "Squeeze backtest", file: "backtest_squeeze.yml", repo: "pub", crons: ["30 4 * * 6"],
    due: { days: "sat", at: [10, 0], allow: 14 }, when: "Saturday 10:00", what: "Re-tests the squeeze strategy on the week's data.", how: "Resumable: a long run continues where it stopped." },
  { id: "names", g: "week", name: "Security names", file: "security_names.yml", repo: "pub", crons: ["30 4 * * 0"],
    due: { days: "sun", at: [10, 0], allow: 12 }, when: "Sunday 10:00", what: "Refreshes the list of security names (ETF detection).", how: "Quiet-day job." },

  { id: "build", g: "tools", name: "Dashboard build", file: "build_dashboard.yml", repo: "pub", manual: true, when: "When the dashboard code changes",
    what: "Compiles the dashboard into the fast page GitHub Pages serves.", how: "If a build fails, the previous page stays up." },
  { id: "setup", g: "tools", name: "Setup check", file: "setup_check.yml", repo: "pub", manual: true, when: "When you run it", what: "Sends a test phone alert and checks the Kite logins.", how: "" },

  { id: "collect", g: "tools", name: "Backtest collectors", file: "backtest_collect.yml", repo: "pub", manual: true, when: "When you run them", what: "One-off history collection (also OHLC history, gap fill, shares outstanding).", how: "" },
  { id: "legacy", g: "tools", name: "Legacy price update", file: "prices.yml", repo: "pub", manual: true, when: "Manual fallback only", what: "The old price job, kept as a fallback to the Kite loop.", how: "" },

  { id: "worker", g: "other", name: "Login & order-link worker (Cloudflare)", static: true, when: "Always on; starts the price loop at 09:10 on weekdays",
    what: "Runs your one-tap logins and the “Review order in Kite” links in alerts.", how: "Lives in your Cloudflare account. This page can't read its status; a missing 09:10 start shows up as the price loop not running." },
  { id: "jyothy", g: "other", name: "JYOTHYLAB buyback check (Claude)", static: true, when: "Once, Tue 1 Dec 20:00 — needs your laptop on",
    what: "Books the accepted buyback shares once the buyback settles.", how: "A one-off Claude reminder in your Stock market chat." },
  { id: "retired", g: "other", name: "Old Claude morning & evening tasks", static: true, retired: true, when: "Off since 26–27 Nov 2026",
    what: "Replaced by the GitHub morning summary and the evening check-in, which don't need your laptop.", how: "" },
];
const GROUPS = [
  ["day", "Every trading day", "login to the evening check-in"],

}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {
    const ta = el("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.append(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e2) {} ta.remove(); return ok;
  }
}
function askHandler(kind0, qid, id, noteEl) {
  return async () => {
    if (!STATE) return;
    let kind = kind0;
    const text = prompt(($(qid) || {}).value || "", id);
    const url = `https://claude.ai/new?q=${encodeURIComponent(text)}`;
    if (kind !== "copy" && url.length > 7000) kind = "copy";   // very long links get cut off: copy instead
    if (kind === "copy") {
      const pending = copyText(text);            // starts the copy inside the tap, before the new tab takes focus
      window.open(PROJECT_URL, "_blank", "noopener");
      const ok = await pending;
      noteEl.textContent = ok ? "Copied. Your Stock market chat is opening — paste it there (Claude there can also check and fix things)." : "Couldn't copy on this device. Use “Ask in a new Claude chat” instead.";
    } else {
      window.open(url, "_blank", "noopener");
      noteEl.textContent = "Opened a new Claude chat with your question and the status.";
    }
  };
}

let OPENER = null;
function openSheet(id, keep) {
  if (!keep) OPENER = document.activeElement;
  const a = AGENTS.find(x => x.id === id), v = VERDICT[id], now = STATE.now;
  OPEN = id;
  const body = $("d-body"); body.textContent = "";
  const chip = el("span", `chip s-${v.s}`, v.label || LABEL[v.s]);
  const h = el("h3", null, a.name); h.id = "d-title";
  body.append(chip, h, el("p", "why", v.why));
  body.append(el("h4", null, "What it does"), el("p", null, a.what));
  if (a.how) body.append(el("h4", null, "How it works"), el("p", null, a.how));
  body.append(el("h4", null, "When it runs"), el("p", null, a.when));
  const allFacts = v.facts.concat(v.pfacts || []);
  if (allFacts.length) { const ul = el("ul", "facts"); for (const f of allFacts) ul.append(el("li", null, f)); body.append(el("h4", null, "Status details"), ul); }
  if (v.runs && v.runs.length) {
    const t = el("table", "runs"), tb = el("tbody");
    for (const r of v.runs.slice(0, 8)) {
      const tr = el("tr"), state = r.status === "completed" ? r.conclusion : r.status;
      const mins = r.run_started_at && r.updated_at && r.status === "completed" ? Math.max(0, Math.round((new Date(r.updated_at) - new Date(r.run_started_at)) / MIN)) : null;
      const c1 = el("td", null, when(tRun(r), now)), c2 = el("td", null, `${state}${mins != null ? ` · ${mins} min` : ""} · ${r.event}`), c3 = el("td");
      if (/^https:\/\/github\.com\//.test(r.html_url || "")) { const ln = el("a", null, "Log"); ln.href = r.html_url; ln.target = "_blank"; ln.rel = "noopener"; c3.append(ln); }
      tr.append(c1, c2, c3); tb.append(tr);
    }
    t.append(tb); body.append(el("h4", null, "Recent runs"), t);
  }
  if (a.file) { const p = el("p"); const ln = el("a", null, "Open this job on GitHub"); ln.href = `https://github.com/${a.repo === "priv" ? PRIV : PUB}/actions/workflows/${a.file}`; ln.target = "_blank"; ln.rel = "noopener"; p.append(ln); body.append(p); }
  body.append(el("h4", null, "Ask Claude about this agent"));
  const ta = el("textarea"); ta.id = "q-one"; ta.placeholder = "e.g. Why did this fail? What should I do?";
  const acts = el("div", "acts"), b1 = el("button", "btn primary", "Copy & open my Stock market chat"), b2 = el("button", "btn", "Ask in a new Claude chat");
  b1.type = b2.type = "button"; const note = el("p", "note"); note.setAttribute("aria-live", "polite");
  b1.addEventListener("click", askHandler("copy", "q-one", id, note)); b2.addEventListener("click", askHandler("new", "q-one", id, note));
  acts.append(b1, b2); body.append(ta, acts, note);
  if (!keep) { $("sheet").hidden = false; $("shade").hidden = false; $("d-close").focus(); }
}
function closeSheet() { OPEN = null; $("sheet").hidden = true; $("shade").hidden = true; if (OPENER && OPENER.focus) OPENER.focus(); }
$("d-close").addEventListener("click", closeSheet);
$("shade").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape" && OPEN) closeSheet(); });
for (const b of document.querySelectorAll("[data-ask]")) b.addEventListener("click", askHandler(b.dataset.ask, b.dataset.q, null, $("copied-all")));

let busy = false;
async function refresh() {
  if (busy) return; busy = true; $("refresh").textContent = "Checking…";
  try { STATE = await load(); draw(); }
  catch (e) { $("finding").textContent = "Couldn't load the status. Check the connection and tap Refresh."; }
  finally { busy = false; $("refresh").textContent = "Refresh"; }
}
$("refresh").addEventListener("click", refresh);
refresh();
// with a key the hourly API allowance is large: keep the page current while it is open
if (PAT) {
  setInterval(() => { if (document.visibilityState === "visible") refresh(); }, 3 * 60e3);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && STATE && Date.now() - STATE.now > 60e3) refresh(); });
}
window.__agents = { judge, nextFire, dueWindow, AGENTS, isTrading, ist, prompt: (q, id) => prompt(q, id) };
}
